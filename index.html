<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BB Burkina Bear - Discussion</title>
  <style>
    :root{--blue:#58a6d7;--cream:#fffaf1;--sand:#f6e7bd;--green:#23d400;--red:#b71e1e;--text:#24170e;--line:#d9c6ac;--shadow:0 14px 34px rgba(40,22,10,.18)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#fff;color:var(--text);display:flex;justify-content:center;padding:24px 0}.phone{width:min(96vw,720px);min-height:calc(100vh - 48px);background:var(--blue);padding:0 0 28px;box-shadow:var(--shadow);border-radius:34px;overflow:hidden}.hud{display:flex;align-items:center;gap:12px;margin:16px 16px 12px}.hud-btn{width:56px;height:56px;border-radius:14px;border:0;background:#fff;color:#111;font-size:34px;font-weight:900;box-shadow:0 5px 0 #111;display:flex;align-items:center;justify-content:center;cursor:pointer}.hud-close{background:#b91f1f;color:#fff;border-radius:50%;box-shadow:0 5px 0 #111}.battery{flex:1;height:45px;border:5px solid #111;background:#fff;padding:4px;display:flex;gap:3px;position:relative}.battery:after{content:'';position:absolute;right:-15px;top:10px;width:10px;height:18px;background:#111}.battery-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#111;text-shadow:0 1px 0 #fff;pointer-events:none}.bat-seg{flex:1;background:#e2e2e2}.bat-seg.on{background:#18d900}.bat-seg.low{background:#ffbb21}.bat-seg.critical{background:#e93a2b}.sound{font-size:26px;margin-left:6px}.panel{background:var(--blue);border-radius:0;min-height:calc(100vh - 116px);padding:18px;position:relative;overflow:hidden}.version{background:#fff3cd;border:1px solid #d8b547;border-radius:12px;padding:8px 10px;margin-bottom:10px;font-weight:900;text-align:center;color:#5b4300}.muted{color:#6e6257;line-height:1.45}.hidden{display:none!important}
    .bear-box{width:218px;height:218px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;margin:8px auto 16px;border:1px solid #eadfce;box-shadow:0 8px 18px rgba(45,24,8,.08),inset 0 0 0 6px #fffaf1}.peluche{width:170px;height:170px;margin:0 auto;background:transparent;border-radius:50%;position:relative;transform-origin:center bottom}.peluche:before{content:'';position:absolute;inset:0;background:#c48a5a;border-radius:50%;box-shadow:inset 0 -10px 0 rgba(0,0,0,.08),0 8px 16px rgba(65,35,12,.12);z-index:1}.oreille{width:72px;height:72px;background:#c48a5a;border-radius:50%;position:absolute;top:-12px;z-index:0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}.oreille:after{content:'';width:32px;height:32px;background:#e2b48d;border-radius:50%;position:absolute;left:20px;top:20px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.05)}.oreille.gauche{left:2px}.oreille.droite{right:2px}.oeil{width:16px;height:16px;background:#222;border-radius:50%;position:absolute;top:65px;z-index:2}.oeil.gauche{left:52px}.oeil.droite{right:52px}.museau{width:72px;height:50px;background:#f2d2b6;border-radius:50%;position:absolute;left:49px;top:88px;z-index:2}.nez{width:22px;height:16px;background:#3a2318;border-radius:50%;position:absolute;left:25px;top:8px}.bouche{width:28px;height:8px;background:#3a2318;border-radius:0 0 20px 20px;position:absolute;left:22px;top:30px}.talking .bouche{animation:bouche .25s infinite alternate}.talking .peluche{animation:pelucheTalk .34s infinite alternate ease-in-out}@keyframes bouche{from{height:6px}to{height:20px}}@keyframes pelucheTalk{from{transform:translateY(0)}to{transform:translateY(-2px)}}
    button{cursor:pointer;border:0;font-weight:900;transition:transform .08s,filter .15s}.btn{width:100%;min-height:58px;border-radius:999px;color:#fff;font-size:21px;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.24);border:3px solid rgba(255,255,255,.8);box-shadow:0 7px 0 #5c3a1f,0 12px 20px rgba(0,0,0,.16),inset 0 12px 0 rgba(255,255,255,.25);margin:9px 0}.green{background:linear-gradient(#9bf442,#45ad12)}.blue{background:linear-gradient(#54d1ff,#168cb9)}.red{background:linear-gradient(#ff6359,#c91f1f)}.yellow{background:linear-gradient(#ffe56b,#d99a04)}.gray{background:linear-gradient(#9fa8ad,#65727a);color:#2d363c;text-shadow:none}.small{font-size:15px;min-height:46px;border-radius:18px}
    .status{background:#f6ebd3;border:1px solid #d5bd98;border-radius:16px;padding:12px;text-align:left;color:#5a3b1e;font-size:14px;line-height:1.45;margin:10px 0}.chat{display:none}.bubble{padding:10px 12px;border-radius:16px;margin:7px 0;line-height:1.45}.me{background:#e6f5dd}.bot{background:#f3dfbf}.talk-shell{display:grid;gap:18px}.talk-head{background:#ececec;border-radius:34px;padding:18px;position:relative;overflow:hidden}.talk-topline{display:flex;justify-content:space-between;align-items:flex-start;gap:22px}.talk-bear .bear-box{width:160px;height:160px;margin:0;border-radius:22px;background:transparent;border:0;box-shadow:none}.talk-bear .peluche{transform:scale(.88);transform-origin:left top}.talk-thought{width:220px;min-height:128px;border-radius:24px;background:#d7d2c7;display:none;align-items:center;justify-content:center;position:relative;flex-shrink:0;margin-left:26px}.talk-thought .gear{font-size:54px;line-height:1;display:inline-block;animation:gearSpin 1.7s linear infinite}.talk-thought .gear.small{font-size:44px;margin-left:-8px;animation-duration:1.1s}.talk-thought:before,.talk-thought:after{content:'';position:absolute;border-radius:50%;background:#d7d2c7}.talk-thought:before{width:30px;height:30px;left:-42px;top:46px}.talk-thought:after{width:18px;height:18px;left:-66px;top:76px}.talk-pill{min-height:62px;border-radius:999px;padding:18px 26px;display:flex;align-items:center;font-size:16px;font-weight:800;line-height:1.35;color:#5c4a37;overflow:hidden}.talk-pill:empty{display:none}.talk-pill.bear{background:#efe2b5;margin-top:18px}.talk-pill.user{background:#d8e8f5;margin:18px 28px 0 28px}.compose-wrap{margin-top:18px;background:#f6f4ef;border:2px solid #d5b08b;border-radius:30px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 114px;gap:16px}.compose-wrap textarea{min-height:220px;border:0;background:transparent;padding:0;margin:0;font-size:17px;resize:none}.compose-wrap textarea:focus{outline:none}.compose-actions{display:grid;gap:16px;align-content:center}.compose-icon{width:100%;height:112px;background:#ffd100;border:8px solid #000;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.18)}.compose-icon.mic{font-size:52px}.talk-shell.listening .compose-icon.mic{animation:micPulse .9s infinite}.talk-shell.thinking .talk-thought{display:flex}.talk-shell.thinking .talk-bear .peluche{animation:thinkBob 1.4s infinite ease-in-out}.talk-shell.listening .talk-user{box-shadow:0 0 0 5px rgba(84,209,255,.22)}@keyframes gearSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes thinkBob{0%,100%{transform:scale(.88) translateY(0)}50%{transform:scale(.88) translateY(-4px)}}
    .loader{position:fixed;inset:0;background:rgba(0,0,0,.34);display:none;align-items:center;justify-content:center;z-index:30}.loader.show{display:flex}.loader-card{background:#fff6e8;border-radius:24px;padding:24px;text-align:center;box-shadow:var(--shadow)}.spinner{width:58px;height:58px;border-radius:50%;border:7px solid #e2c69c;border-top-color:#5a3b1e;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}pre{background:#111;color:#eee;border-radius:12px;padding:12px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12px;text-align:left}.diag{margin-top:14px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#3b2615;color:#fff;padding:12px 15px;border-radius:14px;z-index:50;display:none}.toast.show{display:block}
    @media(max-width:420px){body{padding:10px 0}.phone{padding:0;width:min(96vw,720px);min-height:calc(100vh - 20px);border-radius:24px}.panel{padding:14px}.hud-btn{width:46px;height:46px;font-size:26px}.battery{height:36px}.talk-topline{display:block}.talk-thought{width:100%;margin:10px 0 0 0}.compose-wrap{grid-template-columns:1fr}.compose-actions{grid-template-columns:1fr 1fr;align-content:initial}.compose-icon{height:86px}}
  </style>
</head>
<body>
<div class="phone">
  <div class="hud"><button class="hud-btn" onclick="window.close()">⌂</button><div id="battery" class="battery"></div><div class="sound">🔊</div><button class="hud-btn hud-close" onclick="window.close()">×</button></div>
  <div class="panel">
    <div class="version">Module discussion BBbear — V4.02 TTS robuste</div>
    <div id="talkShell" class="talk-shell idle">
      <div class="talk-head">
        <div class="talk-topline">
          <div class="talk-bear">
            <div class="bear-box"><div class="peluche"><div class="oreille gauche"></div><div class="oreille droite"></div><div class="oeil gauche"></div><div class="oeil droite"></div><div class="museau"><div class="nez"></div><div class="bouche"></div></div></div></div>
          </div>
          <div class="talk-thought"><span class="gear">⚙</span><span class="gear small">⚙</span></div>
        </div>
        <div id="talkBearText" class="talk-pill bear">Le nounours est prêt à t’écouter.</div>
        <div id="talkUserText" class="talk-pill user talk-user">Appuie sur le micro ou écris ton message.</div>
        <div class="compose-wrap">
          <textarea id="messageText" placeholder="Écris ton message..."></textarea>
          <div class="compose-actions">
            <button class="compose-icon" onclick="sendText()" title="Envoyer">↩</button>
            <button id="talkMicBtn" class="compose-icon mic" onclick="startMicro()" title="Micro">🎙</button>
          </div>
        </div>
      </div>
      <div id="chatBox" class="chat"><div class="bubble bot">Je t’écoute.</div></div>
    </div>
    <div class="status" id="statusBox">Initialisation...</div>
    <div class="diag"><strong>Diagnostic :</strong><pre id="diagnostic">Aucune erreur.</pre></div>
  </div>
</div>
<div id="loader" class="loader"><div class="loader-card"><div class="spinner"></div><strong id="loaderText">Chargement...</strong></div></div><div id="toast" class="toast"></div>
<script>
const DEFAULT_TIMEOUT_MS=120000;
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let token='',apiUrl='',username='',childName='',bearName='BB Burkina Bear',dashboard=null;
const $=id=>document.getElementById(id);

const GEMINI_TTS_MODEL='gemini-3.1-flash-tts-preview';
const GEMINI_VOICE_NAME='Kore';
const GEMINI_TTS_STYLE_PROMPT='[warmly, gently, natural pace] Lis le texte en français avec une voix vivante, douce, claire, rassurante et naturelle. Fais des pauses naturelles. Ne récite pas comme un robot.';
const GEMINI_TTS_MODEL_STORE='BBBEAR_GEMINI_TTS_MODEL';
const GEMINI_TTS_VOICE_STORE='BBBEAR_GEMINI_TTS_VOICE';
const GEMINI_TTS_STYLE_STORE='BBBEAR_GEMINI_TTS_STYLE';

window.addEventListener('load',init);
function init(){
  const params=parseHash();
  token=params.token||'';
  apiUrl=params.apiUrl||params.api||'';
  username=params.username||'';
  childName=params.child||'';
  bearName=params.bear||'BB Burkina Bear';
  renderBattery(0);
  setTalkState('idle',bearName+' est prêt à t’écouter.', childName ? 'Bonjour '+childName+'. Écris ou parle.' : 'Écris ou parle.');
  if(!token||!apiUrl){
    setStatus('Lien incomplet. Ouvre la discussion depuis BBbear Apps Script.');
    diag('Configuration', {tokenPresent:!!token, apiUrlPresent:!!apiUrl});
    return;
  }
  setStatus('Discussion connectée à BBbear.');
  refreshMe().catch(e=>diag('Chargement profil',e.message||String(e)));
  runTtsDebug().catch(()=>{});
}
function parseHash(){const h=(location.hash||'').replace(/^#/,'');const p=new URLSearchParams(h);const o={};p.forEach((v,k)=>o[k]=v);return o}
function setStatus(t){$('statusBox').textContent=t}
function showLoader(t){$('loaderText').textContent=t||'Chargement...';$('loader').classList.add('show')}
function hideLoader(){$('loader').classList.remove('show')}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}
function diag(t,o){$('diagnostic').textContent=($('diagnostic').textContent==='Aucune erreur.'?'':$('diagnostic').textContent+'\n\n')+'--- '+t+' ---\n'+(typeof o==='string'?o:JSON.stringify(o,null,2))}
function setTalkState(state,bearText,userText){const shell=$('talkShell');if(shell){shell.classList.remove('idle','listening','thinking');shell.classList.add(state||'idle')}if(bearText!=null)$('talkBearText').textContent=bearText;if(userText!=null)$('talkUserText').textContent=userText}
function addBubble(c,t){const d=document.createElement('div');d.className='bubble '+c;d.textContent=t;$('chatBox').appendChild(d)}

function callServer(fn,...args){
  const map={
    clientMe:{api:'me',keys:['token']},
    clientAsk:{api:'ask',keys:['token','q','moduleCode']},
    clientTts:{api:'tts',keys:['token','text','voiceName','model','style']},
    clientTtsDebug:{api:'ttsDebug',keys:['token','text','voiceName','model','style']}
  };
  const cfg=map[fn];
  if(!cfg)return Promise.reject(new Error('API discussion non configurée : '+fn));
  const params={api:cfg.api};
  cfg.keys.forEach((k,i)=>{const v=args[i];params[k]=v==null?'':(typeof v==='object'?JSON.stringify(v):v)});
  return jsonpRequest(params);
}
function jsonpRequest(params){
  return new Promise((resolve,reject)=>{
    const cb='bbbear_talk_cb_'+Date.now()+'_'+Math.floor(Math.random()*1000000);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('Temps d’attente dépassé vers BBbear après 120 secondes.'))},DEFAULT_TIMEOUT_MS);
    function cleanup(){clearTimeout(timer);if(script.parentNode)script.parentNode.removeChild(script);try{delete window[cb]}catch(e){window[cb]=undefined}}
    window[cb]=data=>{cleanup();resolve(data)};
    script.onerror=()=>{cleanup();reject(new Error('Erreur JSONP vers Apps Script. Vérifie BBBEAR_APP_URL.'))};
    const q=new URLSearchParams();
    Object.keys(params||{}).forEach(k=>q.set(k,params[k]));
    q.set('callback',cb);
    script.src=apiUrl+(apiUrl.includes('?')?'&':'?')+q.toString();
    document.body.appendChild(script);
  });
}
async function refreshMe(){
  const res=await callServer('clientMe',token);
  if(res&&res.ok){dashboard=res.dashboard||{};updateBatteryFromUsage();const u=res.user||{};childName=u.NomEnfant||childName;bearName=u.NomNounours||bearName;setStatus('Connecté : '+(childName||u.Username||username||'utilisateur')+' · '+bearName)}
  else if(res){diag('clientMe',res);setStatus(res.message||'Session non chargée.')}
}
async function sendText(forceText){
  const txt=(forceText||$('messageText').value).trim();
  if(!txt){toast('Écris un message');return}
  addBubble('me',txt);
  $('messageText').value='';
  setTalkState('thinking','',txt);
  showLoader('BB réfléchit...');
  try{
    const res=await callServer('clientAsk',token,txt,'TALK');
    const finalRes=res&&res.result?res.result:res;
    if(!finalRes||!finalRes.ok){diag('Discussion',res);toast((finalRes&&finalRes.message)||'Erreur');setTalkState('idle','Je n’ai pas pu répondre pour le moment.',txt);return}
    if(finalRes.usage){dashboard=dashboard||{};dashboard.usage=finalRes.usage;updateBatteryFromUsage()}
    const rep=finalRes.reponse||finalRes.response||finalRes.answer||finalRes.message||'';
    if(!rep){diag('Réponse vide',res);toast('Réponse vide. Voir diagnostic.');setTalkState('idle','Réponse vide reçue.',txt);return}
    addBubble('bot',rep);
    setTalkState('idle',rep,txt);
    speak(rep);
    refreshMe().catch(()=>{});
  }catch(e){diag('Erreur discussion',e.message||String(e));setTalkState('idle','Une erreur est survenue.',txt)}finally{hideLoader()}
}
function startMicro(){
  if(!SpeechRecognition){toast('Micro indisponible. Utilise Chrome.');return}
  const r=new SpeechRecognition();
  r.lang='fr-FR';
  r.continuous=false;
  r.interimResults=false;
  setTalkState('listening','Le nounours écoute...','Parle maintenant.');
  showLoader('J’écoute...');
  r.onresult=e=>{const t=e.results[0][0].transcript||'';$('messageText').value=t;hideLoader();sendText(t)};
  r.onerror=e=>{hideLoader();diag('Micro',e.error);toast('Erreur micro');setTalkState('idle','Je n’ai pas bien entendu.','Réessaie avec le micro ou le clavier.')};
  r.onend=()=>hideLoader();
  try{r.start()}catch(e){hideLoader();diag('Micro',e.message);setTalkState('idle','Le micro ne peut pas démarrer.','Réessaie encore.')}
}
async function speak(t){
  if(!t)return;
  stopAllAudio();
  setBearTalking(true);
  try{
    const textForVoice=cleanTextForVoice(t);
    const audio=await generateGeminiTtsServer(textForVoice,getGeminiVoiceName(),getGeminiTtsModel());
    diag('Gemini TTS OK',{model:audio.model,voiceName:audio.voiceName,mimeType:audio.mimeType,attempts:audio.attempts||[]});
    await playGeminiAudio(audio.base64,audio.mimeType);
  }catch(e){
    diag('Gemini TTS', (e&&e.message)||String(e));
    diag('Voix de secours navigateur','Gemini TTS n’a pas renvoyé un audio jouable. La meilleure voix française disponible dans ce navigateur est utilisée.');
    browserSpeakFallback(t);
  }
}
function stopAllAudio(){try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}if(window.__bbbearAudio){try{window.__bbbearAudio.pause()}catch(e){}window.__bbbearAudio=null}}
function setBearTalking(isTalking){document.querySelectorAll('.bear-box').forEach(x=>x.classList.toggle('talking',!!isTalking))}
function cleanTextForVoice(t){t=String(t||'').replace(/[\r\n]+/g,'. ').replace(/[*_#>`~]/g,' ').replace(/\s+/g,' ').trim();if(t.length>850)t=t.substring(0,850)+'...';return t}
function getBestFrenchBrowserVoice(){
  if(!window.speechSynthesis)return null;
  const voices=speechSynthesis.getVoices()||[];
  const fr=voices.filter(v=>String(v.lang||'').toLowerCase().indexOf('fr')===0);
  const pref=['google français','google french','microsoft denise','microsoft henri','hortense','thomas','amelie','audrey','aurelie'];
  for(const key of pref){const v=fr.find(x=>String(x.name||'').toLowerCase().includes(key));if(v)return v;}
  return fr[0]||voices[0]||null;
}
function browserSpeakFallback(t){
  if(!speechSynthesis||!t){setBearTalking(false);return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(cleanTextForVoice(t));
  const v=getBestFrenchBrowserVoice();
  u.lang='fr-FR';
  if(v)u.voice=v;
  u.rate=.88;
  u.pitch=1.08;
  u.volume=1;
  u.onend=()=>setBearTalking(false);
  u.onerror=()=>setBearTalking(false);
  speechSynthesis.speak(u);
}
async function generateGeminiTtsServer(text,voiceName,modelName){
  const res=await callServer('clientTts',token,String(text||''),voiceName||getGeminiVoiceName(),modelName||getGeminiTtsModel(),getGeminiTtsStyle());
  if(!res||!res.ok)throw new Error((res&&res.message)?res.message:'Erreur TTS serveur.');
  return{base64:res.audioBase64||res.base64,mimeType:res.mimeType||'audio/l16; rate=24000; channels=1',model:res.model,voiceName:res.voiceName,attempts:res.attempts||[]}
}
async function runTtsDebug(){
  try{
    const res=await callServer('clientTtsDebug',token,'Bonjour. Ceci est un test de voix naturelle pour BB Burkina Bear.',getGeminiVoiceName(),getGeminiTtsModel(),getGeminiTtsStyle());
    diag('Auto diagnostic TTS',res);
  }catch(e){
    diag('Auto diagnostic TTS impossible',(e&&e.message)||String(e));
  }
}
try{if(window.speechSynthesis){speechSynthesis.onvoiceschanged=function(){getBestFrenchBrowserVoice();};}}catch(e){}
async function playGeminiAudio(base64Audio,mimeType){if(!base64Audio)throw new Error('Audio Gemini vide.');let blob;if(String(mimeType||'').toLowerCase().includes('wav')){const bytes=base64ToUint8Array(base64Audio);blob=new Blob([bytes],{type:'audio/wav'})}else{const pcmBytes=base64ToUint8Array(base64Audio);blob=pcm16ToWavBlob(pcmBytes,extractSampleRate(mimeType)||24000,1)}const url=URL.createObjectURL(blob);const audio=new Audio(url);window.__bbbearAudio=audio;audio.onended=()=>{setBearTalking(false);URL.revokeObjectURL(url)};audio.onerror=()=>{setBearTalking(false);URL.revokeObjectURL(url)};await audio.play()}
function base64ToUint8Array(base64){const binary=atob(base64);const len=binary.length;const bytes=new Uint8Array(len);for(let i=0;i<len;i++)bytes[i]=binary.charCodeAt(i);return bytes}
function extractSampleRate(mimeType){const m=String(mimeType||'').match(/rate=(\d+)/i);return m?Number(m[1]):null}
function pcm16ToWavBlob(pcmBytes,sampleRate,channels){const bytesPerSample=2;const blockAlign=channels*bytesPerSample;const byteRate=sampleRate*blockAlign;const wavHeaderSize=44;const wavBuffer=new ArrayBuffer(wavHeaderSize+pcmBytes.length);const view=new DataView(wavBuffer);writeString(view,0,'RIFF');view.setUint32(4,36+pcmBytes.length,true);writeString(view,8,'WAVE');writeString(view,12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,channels,true);view.setUint32(24,sampleRate,true);view.setUint32(28,byteRate,true);view.setUint16(32,blockAlign,true);view.setUint16(34,16,true);writeString(view,36,'data');view.setUint32(40,pcmBytes.length,true);const wavBytes=new Uint8Array(wavBuffer);wavBytes.set(pcmBytes,wavHeaderSize);return new Blob([wavBytes],{type:'audio/wav'})}
function writeString(view,offset,string){for(let i=0;i<string.length;i++)view.setUint8(offset+i,string.charCodeAt(i))}
function getGeminiTtsModel(){return localStorage.getItem(GEMINI_TTS_MODEL_STORE)||GEMINI_TTS_MODEL}
function getGeminiVoiceName(){return localStorage.getItem(GEMINI_TTS_VOICE_STORE)||GEMINI_VOICE_NAME}
function getGeminiTtsStyle(){return localStorage.getItem(GEMINI_TTS_STYLE_STORE)||GEMINI_TTS_STYLE_PROMPT}
function updateBatteryFromUsage(){const u=dashboard?.usage||{};const remaining=Number(u.remaining??0);const limit=Number(u.limit??0);const ratio=limit>0?Math.max(0,Math.min(1,remaining/limit)):0;renderBatteryRatio(ratio,remaining,limit)}
function renderBattery(p){renderBatteryRatio(Math.max(0,Math.min(1,Number(p||0)/100)),null,null)}
function renderBatteryRatio(ratio,remaining,limit){const total=10;const lit=ratio<=0?0:Math.max(1,Math.ceil(ratio*total));let cls='on';if(ratio<=0.2)cls='critical';else if(ratio<=0.4)cls='low';const label=(remaining!=null&&limit!=null&&limit>0)?`${remaining}/${limit}`:`${Math.round(ratio*100)}%`;$('battery').innerHTML=Array.from({length:total},(_,i)=>'<span class="bat-seg '+(i<lit?cls:'')+'"></span>').join('')+'<span class="battery-label">'+label+'</span>'}
</script>
