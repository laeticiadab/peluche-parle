name: Vérification passerelle SMS PHP
on:
  pull_request:
    branches: [studioaty-sms-receiver]
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: php -v
      - run: php -l index.php
      - run: php -l payment-forwarder.php
      - name: Vérifier les extensions PHP requises
        run: |
          php -m | grep -iq '^pdo_sqlite$'
          php -m | grep -iq '^curl$'
      - name: Recette TLS + HMAC + multi-SIM + reprises (données fictives)
        run: python3 tests/test_forwarder.py
